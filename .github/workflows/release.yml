name: Publish release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching the manifest and release notes
        required: true
        default: '1.8.5'
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check version and release notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e 'const fs=require("fs"),v=process.env.VERSION;if(!/^\d+\.\d+\.\d+$/.test(v)||require("./extension/manifest.json").version!==v||!fs.existsSync(`docs/releases/${v}.md`))process.exit(1)'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run package
      - name: Publish versioned package and SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${VERSION}" "dist/x-browser-helper-${VERSION}.zip" "dist/x-browser-helper-${VERSION}.sha256" --target "$GITHUB_SHA" --title "X 浏览助手 ${VERSION}" --notes-file "docs/releases/${VERSION}.md"
