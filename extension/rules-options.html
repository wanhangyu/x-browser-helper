<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>远程规则 · X 浏览助手</title>
<link rel="stylesheet" href="translation-options.css"><main style="max-width:680px;margin:50px auto;padding:24px"><h1>远程过滤规则</h1><p>规则来源：<a href="https://github.com/Icy-Cat/x-viral-monitor" target="_blank" rel="noreferrer">Icy-Cat / X Viral Monitor</a>（MIT）。感谢原作者开放源码和规则。</p><p>开启后，使用 X 时每天最多检查一次更新；仅下载规则 JSON，不上传浏览内容。下载失败保留已有规则。过滤总开关与自定义规则在 X 助手的「设置 → 内容过滤」中。</p><p>访问站点：raw.githubusercontent.com</p><button id="enable">授权并开启更新</button> <button id="update">立即检查更新</button> <button id="disable">关闭并撤销规则站点授权</button><p id="status" role="status"></p><p>撤销的是该来源站点的访问权限。如翻译也使用同一站点，会同时失去该站点权限。</p></main><script src="rules-options.js"></script></html>
